<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | EduSpace</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        :root {
            --primary: #2d6a4f;
            --accent: #52b788;
            --bg: #f8fafc;
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-light: #64748b;
        }

        body {
            margin: 0;
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            display: flex;
            height: 100vh;
            color: var(--text-dark);
        }

        /* Sidebar Navigation */
        .sidebar {
            width: 280px;
            background: var(--white);
            border-right: 1px solid #e2e8f0;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
        }

            .sidebar h2 {
                color: var(--primary);
                font-weight: 700;
                text-align: center;
                margin-bottom: 40px;
            }

        .nav-item {
            padding: 14px 18px;
            cursor: pointer;
            border-radius: 12px;
            margin-bottom: 10px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            color: var(--text-light);
        }

            .nav-item i {
                font-size: 18px;
            }

            .nav-item:hover, .nav-item.active {
                background: var(--primary);
                color: var(--white);
            }

        /* Main Area */
        .main {
            flex: 1;
            padding: 40px;
            overflow-y: auto;
        }

        .section {
            display: none;
            animation: slideUp 0.5s ease-out;
        }

            .section.active {
                display: block;
            }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Profile Card */
        .card {
            background: var(--white);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.02);
            margin-bottom: 25px;
            border: 1px solid #f1f5f9;
        }

        .profile-header {
            text-align: center;
        }

        .st-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid var(--accent);
            object-fit: cover;
            margin-bottom: 15px;
        }

        /* Grid System for Teachers/Courses */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: var(--white);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
            border: 1px solid #edf2f7;
        }

            .item-card:hover {
                transform: translateY(-5px);
                box-shadow: 0 15px 30px rgba(0,0,0,0.05);
            }

            .item-card img {
                width: 80px;
                height: 80px;
                border-radius: 50%;
                margin-bottom: 15px;
                object-fit: cover;
            }

        /* Buttons */
        .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            width: 100%;
            transition: 0.3s;
            margin-top: 10px;
        }

            .btn:hover {
                background: var(--accent);
            }

        .badge {
            background: #eefcf5;
            color: var(--primary);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
        }

        .empty-msg {
            text-align: center;
            color: var(--text-light);
            padding: 40px;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>EduSpace</h2>
        <div class="nav-item active" onclick="showTab('s-dash', this)"><i class="fas fa-th-large"></i> Dashboard</div>
        <div class="nav-item" onclick="showTab('s-teachers', this)"><i class="fas fa-search"></i> Discover Teachers</div>
        <div class="nav-item" onclick="showTab('s-my-courses', this)"><i class="fas fa-book-reader"></i> My Lessons</div>
        <div class="nav-item" onclick="showTab('s-exams', this)"><i class="fas fa-file-alt"></i> Exams & HW</div>
        <div class="nav-item" onclick="showTab('s-grades', this)"><i class="fas fa-award"></i> My Results</div>
    </div>

    <div class="main">
        <section id="s-dash" class="section active">
            <div class="card profile-header">
                <div class="image-wrapper">
                    <img id="s-img" class="st-avatar" src="https://ui-avatars.com/api/?name=Teacher&background=1b4332&color=fff">
                    <input type="file" id="t-upload" hidden onchange="updatePhoto(this)">
                </div>
                <button class="btn" style="width: auto; background: var(--accent);" onclick="document.getElementById('t-upload').click()">Change Photo</button>
                <h2 id="s-name-display">Welcome Back!</h2>
                <p id="s-email-display" style="color: var(--text-light);">student@eduspace.com</p>
                <div style="display: flex; justify-content: center; gap: 10px; margin-top: 10px;">
                    <span class="badge">Active Learner</span>
                </div>

            </div>

           
                </section>

                <section id="s-teachers" class="section">
                    <h2 style="margin-bottom: 20px;">Available Instructors</h2>
                    <div id="teacher-grid" class="grid">
                    </div>
                </section>

                <section id="s-my-courses" class="section">
                    <h2 style="margin-bottom: 20px;">My Educational Content</h2>
                    <div id="course-grid" class="grid"></div>
                </section>

                <section id="s-exams" class="section">
                    <h2 style="margin-bottom: 20px;">Active Exams & Homework</h2>
                    <div id="exam-list"></div>
                </section>

                <section id="s-grades" class="section">
                    <h2 style="margin-bottom: 20px;">My Grades & Feedback</h2>
                    <div id="grade-list"></div>
                </section>
            </div>

            <script>
                 function updatePhoto(input) {
     const reader = new FileReader();
     reader.onload = (e) => {
         document.getElementById('s-img').src = e.target.result;
         localStorage.setItem('s-img', e.target.result);
     };
     reader.readAsDataURL(input.files[0]);
 }
        function showTab(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');

            if(id === 's-teachers') loadTeachers();
            if(id === 's-my-courses') loadCourses();
            if(id === 's-exams') loadExams();
            if(id === 's-grades') loadGrades();
        }

        // 1. FIX: Load Real Teachers from the Marketplace
        function loadTeachers() {
            const grid = document.getElementById('teacher-grid');
            const teachers = JSON.parse(localStorage.getItem('teacherMarket')) || [];

            if(teachers.length === 0) {
                grid.innerHTML = `<p class="empty-msg">No teachers have registered yet.</p>`;
                return;
            }

            grid.innerHTML = teachers.map(t => `
                <div class="item-card">
                    <img src="${t.img || 'https://via.placeholder.com/80'}">
                    <h3>${t.name}</h3>
                    <p style="color:var(--primary); font-weight:bold;">${t.spec || 'Subject Expert'}</p>
                    <button class="btn" onclick="enrollNow('${t.name}')">Enroll Now</button>
                </div>
            `).join('');
        }

        // 2. Enroll Logic: This sends data to the Instructor Page
        function enrollNow(teacherName) {
            let enrolled = JSON.parse(localStorage.getItem('enrolledStudents')) || [];
            const studentName = localStorage.getItem('userName') || "New Student";
            const studentEmail = localStorage.getItem('userEmail') || "No Email";

            // Add student if not already enrolled
            if(!enrolled.find(s => s.name === studentName)) {
                enrolled.push({
                    name: studentName,
                    email: studentEmail,
                    teacherTarget: teacherName, // The teacher they joined
                    date: new Date().toLocaleDateString()
                });
                localStorage.setItem('enrolledStudents', JSON.stringify(enrolled));
                alert("Successfully Enrolled with " + teacherName + "!");
            } else {
                alert("You are already enrolled!");
            }
        }

        // 3. Load Courses
        function loadCourses() {
            const grid = document.getElementById('course-grid');
            const courses = JSON.parse(localStorage.getItem('courses')) || [];

            if(courses.length === 0) {
                grid.innerHTML = `<p class="empty-msg">No lessons published yet.</p>`;
                return;
            }

            grid.innerHTML = courses.map(c => `
                <div class="card">
                    <span class="badge">Lesson</span>
                    <h3>${c.title}</h3>
                    <p style="font-size:14px; color:var(--text-light)">${c.desc || 'No description'}</p>
                    <div style="display:flex; gap:10px;">
                        ${c.pdf ? `<a href="${c.pdf}" target="_blank" class="btn" style="text-decoration:none; text-align:center;">PDF</a>` : ''}
                        ${c.video ? `<a href="${c.video}" target="_blank" class="btn" style="text-decoration:none; text-align:center; background:var(--accent);">Video</a>` : ''}
                    </div>
                </div>
            `).join('');
        }

        // 4. Load Exams
        function loadExams() {
            const list = document.getElementById('exam-list');
            const exams = JSON.parse(localStorage.getItem('exams')) || [];

            if(exams.length === 0) {
                list.innerHTML = `<p class="empty-msg">No exams assigned yet.</p>`;
                return;
            }

            list.innerHTML = exams.map(e => `
                <div class="card" style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <h3 style="margin:0;">${e.title}</h3>
                        <small>By: ${e.teacher || 'Instructor'}</small>
                    </div>
                    <a href="${e.link}" target="_blank" class="btn" style="width:auto; padding:10px 30px; text-decoration:none;">Start Exam</a>
                </div>
            `).join('');
        }

        // 5. Load Grades
        function loadGrades() {
            const list = document.getElementById('grade-list');
            const results = JSON.parse(localStorage.getItem('results')) || [];
            const myName = localStorage.getItem('userName');

            // Filter results for this specific student
            const myResults = results.filter(r => r.student === myName);

            if(myResults.length === 0) {
                list.innerHTML = `<p class="empty-msg">No grades released yet.</p>`;
                return;
            }

            list.innerHTML = myResults.map(r => `
                <div class="card">
                    <div style="display:flex; justify-content:space-between;">
                        <h2 style="color:var(--primary); margin:0;">${r.score}</h2>
                        <span class="badge">Official Result</span>
                    </div>
                    <p style="margin-top:10px;"><strong>Feedback:</strong> ${r.comment || 'Well done!'}</p>
                </div>
            `).join('');
        }

        // Initial Load
        window.onload = () => {
            const name = localStorage.getItem('userName') || "Student";
            const email = localStorage.getItem('userEmail') || "Not Registered";
            document.getElementById('s-name-display').innerText = "Hello, " + name;
            document.getElementById('s-email-display').innerText = email;

            // Load custom avatar if exists
            if(localStorage.getItem('userAvatar')) {
                document.getElementById('s-img').src = localStorage.getItem('userAvatar');
            }
        };
            </script>
</body>
</html>

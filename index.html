<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional Welcome Screen</title>
    <link rel="stylesheet" href="Stylelogin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <div class="background-blobs">
        <div class="blob b1"></div>
        <div class="blob b2"></div>
    </div>

    <div class="main-card">
        <div class="window-controls">
            <span></span>
            <span></span>
        </div>

        <div class="avatar-container">
            <div class="face">
                <div class="eye"></div>
                <div class="eye r"></div>
                <div class="mouth"></div>
            </div>
            <div class="shadow"></div>
        </div>

        <div class="content">
            <h1 class="main-title">Welcome 📚 </h1>
            <p class="sub-title">Please choose your portal to get started</p>
        </div>

        <div class="button-wrapper">
            <button type="button" class="btn btn-student" onclick="window.location.href='student-dash.html'">
                <div class="btn-icon"><i class="fas fa-graduation-cap"></i></div>
                <span>Student Portal</span>
            </button>

            <button type="button" class="btn btn-teacher" onclick="window.location.href='HTMLPage5.html'">
                <div class="btn-icon"><i class="fas fa-chalkboard-teacher"></i></div>
                <span>Teacher Portal</span>
            </button>
        </div>

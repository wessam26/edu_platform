<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Welcome Back</title>
    <link rel="stylesheet" href="Stylesheet4.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="face-icon">
                <div class="eyes"><div class="eye left"></div><div class="eye right wink"></div></div>
                <div class="smile"></div>
            </div>
            <h2>Welcome Back!</h2>
            <form>
                <div class="input-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="your.email@example.com" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <input type="password" placeholder="••••••••" required>
                </div>
                <button type="button" class="signin-btn" onclick="window.location.href='continue.html'">Sign In</button>
                <div class="signup-link">
                    <p>New here? <a href="HTMLPage3.html">Create an account</a></p>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
